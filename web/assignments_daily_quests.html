<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0F19" />
    <title>AstatineEdu | Assignments & Daily Quests</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              colors: {
                void: '#0B0F19',
                panel: '#151C2C',
                cyan: '#00F0FF',
                ast: '#FFB800',
              },
              fontFamily: {
                sans: ['Space Grotesk', 'sans-serif'],
                mono: ['DM Mono', 'monospace'],
              },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --void: #0b0f19;
        --panel: #151c2c;
        --panel-raised: #192235;
        --line: #252f43;
        --muted: #8995aa;
        --cyan: #00f0ff;
        --gold: #ffb800;
      }
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; min-height: 100%; margin: 0; }
      body {
        min-width: 360px;
        min-height: 100vh;
        overflow: hidden;
        background: var(--void);
        color: #edf3ff;
        font-family: 'Space Grotesk', sans-serif;
      }
      button, input { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      .app-grid {
        background-image: linear-gradient(rgba(51, 65, 90, .12) 1px, transparent 1px), linear-gradient(90deg, rgba(51, 65, 90, .12) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }
      .ambient-cyan { background: radial-gradient(ellipse at 14% 0%, rgba(0, 240, 255, .10), transparent 44%); }
      .ambient-gold { background: radial-gradient(ellipse at 92% 0%, rgba(255, 184, 0, .075), transparent 35%); }
      .panel-shell {
        background: linear-gradient(150deg, rgba(23, 31, 48, .96), rgba(17, 24, 39, .98));
        border: 1px solid rgba(116, 136, 169, .18);
        box-shadow: 0 18px 50px rgba(0, 0, 0, .22), inset 0 1px rgba(255, 255, 255, .025);
      }
      .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #42516a #1f293d; }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #1f293d; border-radius: 8px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #42516a; border-radius: 8px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #00aebb; }
      .cyan-glow { box-shadow: 0 0 22px rgba(0, 240, 255, .12), inset 0 0 14px rgba(0, 240, 255, .035); }
      .gold-glow { text-shadow: 0 0 18px rgba(255, 184, 0, .42); }
      .quiz-card { transition: border-color .18s ease, transform .18s ease, background .18s ease; }
      .quiz-card:hover { transform: translateY(-2px); border-color: rgba(0, 240, 255, .45); background: #182236; }
      .send-button { transition: .18s ease; }
      .send-button:hover { box-shadow: 0 0 20px rgba(0, 240, 255, .32); transform: translateY(-1px); }
      .toast-in { animation: toast-in .2s ease-out both; }
      @keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
      @media (max-width: 1000px) {
        body { overflow: auto; }
        .app-frame { min-height: 100vh; height: auto !important; overflow: visible !important; }
        .dashboard-grid { grid-template-columns: 1fr !important; height: auto !important; overflow: visible !important; }
        .dashboard-panel { min-height: 540px; }
        .header-wrap { padding-left: 18px !important; padding-right: 18px !important; }
        .main-wrap { padding-left: 18px !important; padding-right: 18px !important; }
        .top-row { align-items: flex-start !important; flex-wrap: wrap; }
        .wallet { margin-left: auto; }
      }
      @media (max-width: 600px) {
        .top-row { align-items: flex-start !important; flex-direction: column; }
        .wallet { align-self: stretch; justify-content: space-between; }
        .activity-label { align-items: flex-start !important; flex-direction: column; gap: 4px !important; }
        .dashboard-grid { padding-bottom: 24px !important; }
        .assignment-meta { flex-wrap: wrap; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      const { useEffect, useRef, useState } = React;

      const initialAssignments = [
        { id: 1, subject: 'CHEMISTRY', subjectColor: 'cyan', title: 'Balanced Equations', questions: 14, time: '18 min', teacher: 'Ms. Hà', due: '08:22:10', reward: 200 },
        { id: 2, subject: 'PHYSICS', subjectColor: 'violet', title: 'Motion & Forces', questions: 10, time: '12 min', teacher: 'Mr. Minh', due: '1d 04:18:32', reward: 160 },
        { id: 3, subject: 'MATHEMATICS', subjectColor: 'gold', title: 'Quadratic Functions', questions: 12, time: '15 min', teacher: 'Ms. Lan', due: '2d 11:05:09', reward: 180 },
      ];

      const initialMessages = [
        { id: 1, kind: 'system', time: '09:42', text: 'NEW ASSIGNMENT', detail: 'Teacher assigned a new chemistry quiz: Balanced Equations', reward: '+200 AST' },
        { id: 2, kind: 'teacher', name: 'Ms. Hà', time: '09:44', text: 'Good morning, class! I’ve added a quick quiz on balancing equations. Let me know if you need a hint.' },
        { id: 3, kind: 'student', name: 'You', time: '09:48', text: 'Thanks, Ms. Hà! I’ll give it a try now.' },
        { id: 4, kind: 'teacher', name: 'Ms. Hà', time: '09:49', text: 'Remember: count each element on both sides before adding coefficients. You’ve got this!' },
      ];

      const initialQuests = [
        { id: 1, text: 'Review today’s chemistry lesson', reward: 15, done: true },
        { id: 2, text: 'Check in with your teacher', reward: 15, done: true },
        { id: 3, text: 'Complete one daily quiz', reward: 20, done: false },
      ];

      function Icon({ name, size = 16, className = '' }) {
        return <i data-lucide={name} width={size} height={size} className={`inline-block shrink-0 ${className}`} aria-hidden="true" />;
      }

      function AstatineAssignmentsPage() {
        const [tab, setTab] = useState('pending');
        const [filter, setFilter] = useState('chat');
        const [quests, setQuests] = useState(initialQuests);
        const [assignments, setAssignments] = useState(initialAssignments);
        const [completed, setCompleted] = useState([
          { id: 11, subject: 'BIOLOGY', subjectColor: 'green', title: 'Cell Structure & Function', questions: 10, time: '12 min', teacher: 'Ms. Mai', reward: 150 },
          { id: 12, subject: 'CHEMISTRY', subjectColor: 'cyan', title: 'Atomic Structure', questions: 12, time: '15 min', teacher: 'Ms. Hà', reward: 180 },
        ]);
        const [messages, setMessages] = useState(initialMessages);
        const [draft, setDraft] = useState('');
        const [wallet, setWallet] = useState(2450);
        const [points, setPoints] = useState(65);
        const [notice, setNotice] = useState('');
        const [quizModal, setQuizModal] = useState(null);
        const [createModal, setCreateModal] = useState(false);
        const [newQuizTitle, setNewQuizTitle] = useState('');
        const feedRef = useRef(null);
        const visibleAssignments = tab === 'pending' ? assignments : completed;

        useEffect(() => {
          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons({ attrs: { 'stroke-width': 1.8 } });
          }
        }, [tab, filter, quests, assignments, completed, messages, quizModal, createModal, notice]);

        useEffect(() => {
          if (feedRef.current) feedRef.current.scrollTop = feedRef.current.scrollHeight;
        }, [messages.length, filter]);

        useEffect(() => {
          if (!notice) return;
          const timeout = setTimeout(() => setNotice(''), 2600);
          return () => clearTimeout(timeout);
        }, [notice]);

        function toggleQuest(id) {
          setQuests(current => current.map(quest => {
            if (quest.id !== id) return quest;
            const done = !quest.done;
            setPoints(value => Math.max(0, Math.min(100, value + (done ? 10 : -10))));
            setWallet(value => Math.max(0, value + (done ? quest.reward : -quest.reward)));
            return { ...quest, done };
          }));
        }

        function sendMessage(event) {
          event.preventDefault();
          const text = draft.trim();
          if (!text) return;
          setMessages(current => [...current, { id: Date.now(), kind: 'student', name: 'You', time: new Intl.DateTimeFormat('en', { hour: '2-digit', minute: '2-digit' }).format(new Date()), text }]);
          setDraft('');
          setFilter('chat');
        }

        function startQuiz(assignment) {
          setQuizModal(assignment);
        }

        function finishQuiz() {
          if (!quizModal) return;
          const assignment = quizModal;
          setAssignments(current => current.filter(item => item.id !== assignment.id));
          setCompleted(current => [{ ...assignment, id: Date.now() }, ...current]);
          setWallet(value => value + assignment.reward);
          setNotice(`Quiz completed · +${assignment.reward} AST added to your wallet`);
          setQuizModal(null);
          setTab('completed');
        }

        function createQuiz(event) {
          event.preventDefault();
          const title = newQuizTitle.trim();
          if (!title) return;
          setAssignments(current => [{ id: Date.now(), subject: 'CHEMISTRY', subjectColor: 'cyan', title, questions: 10, time: '15 min', teacher: 'You · Teacher', due: '3d 00:00:00', reward: 200 }, ...current]);
          setNewQuizTitle('');
          setCreateModal(false);
          setTab('pending');
          setNotice('Quiz created and added to your assignments');
        }

        const unlocked = [20, 40, 60, 80, 100].filter(value => points >= value).length;

        return (
          <div className="app-frame relative flex h-screen min-h-[720px] flex-col overflow-hidden bg-void text-slate-100">
            <div className="app-grid ambient-cyan ambient-gold pointer-events-none absolute inset-0" />
            <header className="header-wrap relative z-10 shrink-0 px-7 pt-5 pb-4">
              <div className="top-row flex min-h-[52px] items-center justify-between gap-6">
                <div className="flex min-w-0 items-center gap-4">
                  <div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border border-cyan/25 bg-cyan/10 text-cyan shadow-[0_0_24px_rgba(0,240,255,.10)]">
                    <span className="text-xl font-bold tracking-tight">A</span>
                  </div>
                  <div className="min-w-0">
                    <div className="mb-1 flex items-center gap-2 text-[10px] font-semibold uppercase tracking-[.18em] text-slate-500">
                      <span className="text-cyan">ASTATINE</span><span className="text-slate-700">/</span><span>STUDENT HUB</span>
                    </div>
                    <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1">
                      <h1 className="truncate text-[22px] font-semibold leading-none text-white sm:text-[25px]">Assignments &amp; Daily Quests</h1>
                      <span className="hidden text-xs text-slate-500 md:inline">Saturday, Oct 03 <span className="mx-1 text-slate-700">·</span> Class 9A1</span>
                    </div>
                  </div>
                </div>
                <div className="wallet flex shrink-0 items-center gap-3 rounded-xl border border-ast/25 bg-ast/[.07] px-4 py-2.5">
                  <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-ast/10 text-ast"><Icon name="coins" size={18} /></div>
                  <div>
                    <div className="font-mono text-[9px] font-medium tracking-[.16em] text-ast/70">AST WALLET</div>
                    <div className="gold-glow font-mono text-[17px] font-medium leading-tight text-ast">{wallet.toLocaleString('en-US')} <span className="text-[10px]">AST</span></div>
                  </div>
                  <button onClick={() => setNotice('AST wallet · Rewards are added when you complete quizzes and quests.')} className="ml-1 rounded-md p-1.5 text-slate-500 transition hover:bg-white/5 hover:text-ast" aria-label="Wallet details"><Icon name="arrow-up-right" size={15} /></button>
                </div>
              </div>

              <section className="panel-shell mt-4 rounded-2xl px-5 py-4" aria-label="Daily activity progress">
                <div className="activity-label mb-3 flex items-center justify-between gap-3">
                  <div className="flex items-center gap-2.5">
                    <span className="flex h-7 w-7 items-center justify-center rounded-lg bg-cyan/10 text-cyan"><Icon name="activity" size={15} /></span>
                    <div>
                      <div className="text-[10px] font-bold uppercase tracking-[.17em] text-slate-300">Daily activity</div>
                      <div className="mt-0.5 text-[10px] text-slate-500">Keep your streak alive and earn rewards</div>
                    </div>
                  </div>
                  <div className="font-mono text-[12px] text-slate-400"><span className="text-[18px] font-medium text-white">{points}</span><span className="text-slate-600"> / 100</span><span className="ml-2 text-[9px] uppercase tracking-wider text-slate-600">pts</span></div>
                </div>
                <div className="relative mx-1 h-9">
                  <div className="absolute left-0 right-0 top-[12px] h-[5px] rounded-full bg-[#202b3e]" />
                  <div className="absolute left-0 top-[12px] h-[5px] rounded-full bg-gradient-to-r from-cyan/80 via-cyan to-[#57d7e8] shadow-[0_0_13px_rgba(0,240,255,.45)] transition-[width] duration-500" style={{ width: `${points}%` }} />
                  {[20, 40, 60, 80, 100].map((milestone, index) => {
                    const isUnlocked = points >= milestone;
                    return <div key={milestone} className="absolute top-0 flex -translate-x-1/2 flex-col items-center" style={{ left: `${milestone}%` }}>
                      <div className={`flex h-[29px] w-[29px] items-center justify-center rounded-lg border transition-all ${isUnlocked ? 'border-ast/70 bg-ast/15 text-ast shadow-[0_0_16px_rgba(255,184,0,.2)]' : 'border-slate-700 bg-[#182132] text-slate-600'}`} title={`${milestone} point reward`}><Icon name={isUnlocked ? 'package-open' : 'package'} size={15} /></div>
                      <span className={`mt-1 font-mono text-[9px] ${isUnlocked ? 'text-ast' : 'text-slate-600'}`}>{milestone}</span>
                    </div>;
                  })}
                </div>
                <div className="mt-1 flex items-center justify-between text-[9px] text-slate-600"><span>{unlocked} / 5 chests unlocked</span><span className="font-mono text-cyan/75">{Math.max(0, 80 - points)} pts to next chest</span></div>
              </section>
            </header>

            <main className="main-wrap dashboard-grid relative z-10 grid min-h-0 flex-1 grid-cols-[minmax(0,1.25fr)_minmax(390px,.9fr)] gap-5 overflow-hidden px-7 pb-6">
              <section className="panel-shell dashboard-panel flex min-h-0 flex-col rounded-2xl p-5" aria-labelledby="assignments-heading">
                <div className="mb-4 flex shrink-0 items-center justify-between gap-4">
                  <div>
                    <div className="mb-1 flex items-center gap-2"><span className="h-1.5 w-1.5 rounded-full bg-cyan shadow-[0_0_8px_#00f0ff]" /><span className="font-mono text-[9px] uppercase tracking-[.16em] text-slate-500">Learning queue</span></div>
                    <h2 id="assignments-heading" className="text-[17px] font-semibold text-white">Your assignments <span className="ml-1 text-[11px] font-normal text-slate-500">/ Bài tập</span></h2>
                  </div>
                  <button onClick={() => setNotice('Sorted by upcoming due date')} className="hidden items-center gap-2 rounded-lg border border-slate-700/70 px-3 py-2 text-[11px] text-slate-400 transition hover:border-slate-500 hover:text-white sm:flex"><Icon name="list-filter" size={14} /> Due date <Icon name="chevron-down" size={13} /></button>
                </div>

                <div className="mb-3 flex shrink-0 items-center gap-1 border-b border-white/[.07]">
                  <button onClick={() => setTab('pending')} className={`relative px-3 pb-2.5 pt-1 text-[12px] transition ${tab === 'pending' ? 'font-semibold text-white' : 'text-slate-500 hover:text-slate-300'}`}>Pending <span className={`ml-1 rounded-md px-1.5 py-0.5 font-mono text-[9px] ${tab === 'pending' ? 'bg-cyan/10 text-cyan' : 'bg-slate-800 text-slate-500'}`}>{assignments.length}</span>{tab === 'pending' && <span className="absolute bottom-[-1px] left-3 right-3 h-[2px] rounded-full bg-cyan shadow-[0_0_8px_#00f0ff]" />}</button>
                  <button onClick={() => setTab('completed')} className={`relative px-3 pb-2.5 pt-1 text-[12px] transition ${tab === 'completed' ? 'font-semibold text-white' : 'text-slate-500 hover:text-slate-300'}`}>Completed <span className={`ml-1 rounded-md px-1.5 py-0.5 font-mono text-[9px] ${tab === 'completed' ? 'bg-cyan/10 text-cyan' : 'bg-slate-800 text-slate-500'}`}>{completed.length + 5}</span>{tab === 'completed' && <span className="absolute bottom-[-1px] left-3 right-3 h-[2px] rounded-full bg-cyan shadow-[0_0_8px_#00f0ff]" />}</button>
                  <span className="ml-auto hidden pb-2 text-[9px] font-mono uppercase tracking-wider text-slate-600 sm:inline">{tab === 'pending' ? '3 tasks require attention' : 'Recent completions'}</span>
                </div>

                <div className="custom-scrollbar min-h-0 max-h-[500px] flex-1 space-y-2.5 overflow-y-auto pr-1" aria-live="polite">
                  {visibleAssignments.length === 0 ? <div className="flex h-40 flex-col items-center justify-center text-center text-slate-500"><Icon name="circle-check" size={25} className="mb-2 text-cyan" /><div className="text-sm">All caught up</div><div className="mt-1 text-[11px]">Your next quest is just around the corner.</div></div> : visibleAssignments.map(assignment => (
                    <article key={assignment.id} className="quiz-card rounded-xl border border-slate-700/70 bg-[#111827]/85 px-4 py-3.5">
                      <div className="flex items-start justify-between gap-3">
                        <div className="min-w-0">
                          <div className="mb-2 flex items-center gap-2">
                            <span className={`rounded-md border px-2 py-0.5 font-mono text-[8px] font-medium tracking-[.12em] ${assignment.subjectColor === 'gold' ? 'border-ast/25 bg-ast/[.07] text-ast' : assignment.subjectColor === 'violet' ? 'border-violet-400/25 bg-violet-400/[.07] text-violet-300' : assignment.subjectColor === 'green' ? 'border-emerald-400/25 bg-emerald-400/[.07] text-emerald-300' : 'border-cyan/25 bg-cyan/[.06] text-cyan/90'}`}>{assignment.subject}</span>
                            {tab === 'completed' && <span className="flex items-center gap-1 text-[9px] text-emerald-400"><Icon name="circle-check" size={12} /> Completed</span>}
                          </div>
                          <h3 className="truncate text-[14px] font-semibold text-slate-100">{assignment.title}</h3>
                          <div className="assignment-meta mt-2 flex items-center gap-3 text-[10px] text-slate-500">
                            <span className="flex items-center gap-1"><Icon name="list-checks" size={12} /> {assignment.questions} questions</span>
                            <span className="flex items-center gap-1"><Icon name="clock-3" size={12} /> {assignment.time}</span>
                            <span className="flex items-center gap-1"><Icon name="user-round" size={12} /> {assignment.teacher}</span>
                          </div>
                        </div>
                        <div className="shrink-0 rounded-lg border border-ast/20 bg-ast/[.06] px-2.5 py-1.5 text-right"><div className="font-mono text-[9px] uppercase tracking-wider text-ast/55">Reward</div><div className="gold-glow font-mono text-[12px] font-medium text-ast">+{assignment.reward} AST</div></div>
                      </div>
                      <div className="mt-3 flex items-center justify-between border-t border-white/[.06] pt-2.5">
                        <span className={`flex items-center gap-1.5 font-mono text-[9px] ${tab === 'pending' ? 'text-rose-300/90' : 'text-slate-600'}`}><Icon name="timer" size={12} />{tab === 'pending' ? `Due in ${assignment.due}` : 'Submitted · Oct 02'}</span>
                        {tab === 'pending' ? <button onClick={() => startQuiz(assignment)} className="group flex items-center gap-2 rounded-lg border border-cyan/40 bg-cyan/[.08] px-3 py-1.5 font-mono text-[9px] font-medium tracking-[.12em] text-cyan transition hover:border-cyan hover:bg-cyan/15 hover:shadow-[0_0_18px_rgba(0,240,255,.22)]">START QUIZ <Icon name="arrow-up-right" size={13} className="transition group-hover:translate-x-0.5 group-hover:-translate-y-0.5" /></button> : <span className="font-mono text-[9px] text-emerald-400">+{assignment.reward} AST earned</span>}
                      </div>
                    </article>
                  ))}
                </div>

                <div className="mt-3 shrink-0 border-t border-white/[.07] pt-3">
                  <div className="mb-2 flex items-center justify-between gap-3">
                    <div className="flex items-center gap-2 text-[11px] font-semibold text-slate-300"><Icon name="sparkles" size={14} className="text-ast" /> Daily quests <span className="font-mono text-[9px] font-normal text-slate-600">{quests.filter(item => item.done).length}/{quests.length}</span></div>
                    <button onClick={() => setCreateModal(true)} className="flex items-center gap-1.5 rounded-lg px-2 py-1.5 text-[10px] text-slate-500 transition hover:bg-white/[.04] hover:text-cyan"><Icon name="plus" size={13} /> Teacher: Create quiz</button>
                  </div>
                  <div className="grid grid-cols-1 gap-1.5 sm:grid-cols-3">
                    {quests.map(quest => <button key={quest.id} onClick={() => toggleQuest(quest.id)} className={`flex min-w-0 items-center gap-2 rounded-lg border px-2.5 py-2 text-left transition ${quest.done ? 'border-cyan/15 bg-cyan/[.035]' : 'border-slate-700/60 bg-[#101725]/70 hover:border-slate-500'}`}>
                      <span className={`flex h-4 w-4 shrink-0 items-center justify-center rounded border ${quest.done ? 'border-cyan bg-cyan text-[#07131b]' : 'border-slate-600 text-transparent'}`}>{quest.done && <Icon name="check" size={11} />}</span>
                      <span className={`min-w-0 flex-1 truncate text-[9px] ${quest.done ? 'text-slate-500 line-through' : 'text-slate-300'}`}>{quest.text}</span>
                      <span className="shrink-0 font-mono text-[8px] text-ast/75">+{quest.reward}</span>
                    </button>)}
                  </div>
                </div>
              </section>

              <section className="panel-shell dashboard-panel flex min-h-0 flex-col overflow-hidden rounded-2xl" aria-labelledby="chat-heading">
                <div className="shrink-0 border-b border-white/[.07] px-5 pt-4">
                  <div className="flex items-center justify-between gap-3">
                    <div className="flex min-w-0 items-center gap-3">
                      <div className="relative flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-blue-400/25 bg-blue-400/10 text-blue-300"><Icon name="messages-square" size={19} /><span className="absolute -bottom-1 -right-1 h-3 w-3 rounded-full border-2 border-[#151c2c] bg-emerald-400 shadow-[0_0_9px_rgba(52,211,153,.6)]" /></div>
                      <div className="min-w-0"><div className="flex flex-wrap items-center gap-x-2 gap-y-0.5"><h2 id="chat-heading" className="truncate text-[15px] font-semibold text-white">Chat với Giáo Viên</h2><span className="hidden rounded border border-blue-400/20 bg-blue-400/[.07] px-1.5 py-0.5 font-mono text-[8px] uppercase tracking-wider text-blue-300 sm:inline">Direct</span></div><div className="mt-1 flex items-center gap-1.5 text-[10px] text-slate-500"><span className="h-1.5 w-1.5 rounded-full bg-emerald-400" /> Ms. Hà <span className="text-slate-700">·</span> Teacher <span className="text-slate-700">·</span> Online</div></div>
                    </div>
                    <button onClick={() => setNotice('Teacher chat is private to you and your class.')} className="rounded-lg p-2 text-slate-500 transition hover:bg-white/[.05] hover:text-slate-200" aria-label="Chat options"><Icon name="ellipsis" size={18} /></button>
                  </div>
                  <div className="mt-3 flex gap-1">
                    <button onClick={() => setFilter('chat')} className={`flex items-center gap-1.5 rounded-t-lg px-3 py-2 text-[10px] font-medium transition ${filter === 'chat' ? 'border-b-2 border-cyan bg-cyan/[.05] text-cyan' : 'border-b-2 border-transparent text-slate-500 hover:text-slate-300'}`}><Icon name="messages-square" size={13} />Chat Lớp</button>
                    <button onClick={() => setFilter('activity')} className={`flex items-center gap-1.5 rounded-t-lg px-3 py-2 text-[10px] font-medium transition ${filter === 'activity' ? 'border-b-2 border-cyan bg-cyan/[.05] text-cyan' : 'border-b-2 border-transparent text-slate-500 hover:text-slate-300'}`}><Icon name="radio" size={13} />Hoạt Động</button>
                  </div>
                </div>

                <div ref={feedRef} className="custom-scrollbar max-h-[460px] min-h-0 flex-1 space-y-4 overflow-y-auto px-5 py-4">
                  {filter === 'activity' ? <div className="space-y-3">
                    {messages.filter(message => message.kind === 'system').map(message => <SystemMessage key={message.id} message={message} />)}
                    <div className="flex gap-3 rounded-xl border border-slate-700/50 bg-[#111827]/70 p-3"><span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-ast/10 text-ast"><Icon name="trophy" size={15} /></span><div><div className="text-[11px] font-medium text-slate-200">Daily activity updated</div><div className="mt-1 text-[10px] leading-relaxed text-slate-500">You’ve earned {points} points today. {unlocked} reward chests are now unlocked.</div></div></div>
                    <div className="flex gap-3 rounded-xl border border-slate-700/50 bg-[#111827]/70 p-3"><span className="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-cyan/10 text-cyan"><Icon name="badge-check" size={15} /></span><div><div className="text-[11px] font-medium text-slate-200">Class streak · Day 6</div><div className="mt-1 text-[10px] text-slate-500">Your class has checked in six days in a row.</div></div></div>
                  </div> : <>
                    <div className="flex items-center justify-center gap-2 text-[9px] font-mono uppercase tracking-[.13em] text-slate-600"><span className="h-px flex-1 bg-slate-800" />Today · 09:42<span className="h-px flex-1 bg-slate-800" /></div>
                    {messages.map(message => message.kind === 'system' ? <SystemMessage key={message.id} message={message} /> : <ChatMessage key={message.id} message={message} />)}
                  </>}
                </div>

                <form onSubmit={sendMessage} className="sticky bottom-0 z-10 shrink-0 border-t border-white/[.07] bg-[#121a29]/95 px-4 py-3 backdrop-blur">
                  <div className="flex items-end gap-2 rounded-xl border border-slate-700/80 bg-[#0d1421] p-1.5 focus-within:border-cyan/40 focus-within:shadow-[0_0_0_3px_rgba(0,240,255,.04)]">
                    <button type="button" onClick={() => setNotice('Attachment picker is ready for class files.')} className="mb-0.5 rounded-lg p-2 text-slate-500 transition hover:bg-white/[.05] hover:text-cyan" aria-label="Attach a file"><Icon name="paperclip" size={17} /></button>
                    <input value={draft} onChange={event => setDraft(event.target.value)} placeholder="Message Ms. Hà..." className="min-w-0 flex-1 bg-transparent px-1 py-2 text-[11px] text-slate-200 outline-none placeholder:text-slate-600" aria-label="Message input" />
                    <button type="submit" disabled={!draft.trim()} className="send-button mb-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-cyan text-[#06151b] disabled:cursor-not-allowed disabled:opacity-35" aria-label="Send message"><Icon name="send" size={16} /></button>
                  </div>
                  <div className="mt-1.5 px-1 text-[8px] text-slate-700">Messages are visible to you and your teacher</div>
                </form>
              </section>
            </main>

            {notice && <div role="status" className="toast-in fixed bottom-5 left-1/2 z-50 flex -translate-x-1/2 items-center gap-2 rounded-xl border border-cyan/25 bg-[#162235] px-4 py-3 text-[11px] text-slate-200 shadow-2xl"><Icon name="circle-check" size={15} className="text-cyan" />{notice}</div>}
            {quizModal && <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/65 p-4 backdrop-blur-sm" onMouseDown={event => { if (event.target === event.currentTarget) setQuizModal(null); }}><div className="panel-shell w-full max-w-md rounded-2xl p-6"><div className="mb-4 flex items-center justify-between"><span className="rounded-md border border-cyan/25 bg-cyan/[.07] px-2 py-1 font-mono text-[9px] tracking-widest text-cyan">{quizModal.subject}</span><button onClick={() => setQuizModal(null)} className="rounded-lg p-2 text-slate-500 hover:bg-white/5 hover:text-white" aria-label="Close quiz"><Icon name="x" size={17} /></button></div><h3 className="text-xl font-semibold text-white">{quizModal.title}</h3><p className="mt-2 text-xs leading-relaxed text-slate-400">{quizModal.questions} questions · {quizModal.time} · Earn <span className="font-mono text-ast">+{quizModal.reward} AST</span> on completion.</p><div className="my-5 rounded-xl border border-slate-700/70 bg-[#101725] p-4"><div className="flex items-center gap-2 text-[11px] font-medium text-slate-200"><Icon name="lightbulb" size={15} className="text-ast" />Before you begin</div><p className="mt-2 text-[10px] leading-relaxed text-slate-500">Read each question carefully. You can review your answers before submitting.</p></div><button onClick={finishQuiz} className="w-full rounded-lg bg-cyan px-4 py-3 font-mono text-[10px] font-semibold tracking-[.14em] text-[#06151b] transition hover:shadow-[0_0_20px_rgba(0,240,255,.28)]">BEGIN QUIZ <span className="ml-1">→</span></button></div></div>}
            {createModal && <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/65 p-4 backdrop-blur-sm" onMouseDown={event => { if (event.target === event.currentTarget) setCreateModal(false); }}><form onSubmit={createQuiz} className="panel-shell w-full max-w-md rounded-2xl p-6"><div className="mb-4 flex items-center justify-between"><div><div className="font-mono text-[9px] uppercase tracking-[.15em] text-cyan">Teacher tools</div><h3 className="mt-1 text-lg font-semibold text-white">Create a quiz</h3></div><button type="button" onClick={() => setCreateModal(false)} className="rounded-lg p-2 text-slate-500 hover:bg-white/5 hover:text-white" aria-label="Close"><Icon name="x" size={17} /></button></div><label className="mb-2 block text-[10px] font-medium uppercase tracking-wider text-slate-500" htmlFor="quiz-title">Quiz title</label><input id="quiz-title" autoFocus value={newQuizTitle} onChange={event => setNewQuizTitle(event.target.value)} placeholder="e.g. Chemical Reactions" className="w-full rounded-lg border border-slate-700 bg-[#0d1421] px-3 py-2.5 text-xs text-white outline-none placeholder:text-slate-600 focus:border-cyan/50" /><div className="mt-4 grid grid-cols-2 gap-3"><label className="text-[10px] text-slate-500">Subject<select className="mt-1.5 w-full rounded-lg border border-slate-700 bg-[#0d1421] px-3 py-2.5 text-xs text-slate-200"><option>Chemistry</option><option>Physics</option><option>Mathematics</option></select></label><label className="text-[10px] text-slate-500">Class<select className="mt-1.5 w-full rounded-lg border border-slate-700 bg-[#0d1421] px-3 py-2.5 text-xs text-slate-200"><option>Class 9A1</option><option>Class 9A2</option></select></label></div><button type="submit" disabled={!newQuizTitle.trim()} className="mt-5 flex w-full items-center justify-center gap-2 rounded-lg border border-cyan/40 bg-cyan/[.08] px-4 py-3 font-mono text-[10px] font-semibold tracking-[.12em] text-cyan transition hover:bg-cyan/15 disabled:opacity-40"><Icon name="plus" size={14} /> CREATE QUIZ</button></form></div>}
          </div>
        );
      }

      function SystemMessage({ message }) {
        return <div className="rounded-xl border border-ast/20 bg-gradient-to-r from-ast/[.08] to-transparent p-3.5"><div className="flex items-start gap-2.5"><span className="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg border border-ast/20 bg-ast/10 text-ast"><Icon name="bell-ring" size={14} /></span><div className="min-w-0 flex-1"><div className="flex items-center justify-between gap-2"><span className="font-mono text-[9px] font-medium tracking-[.11em] text-ast">{message.text}</span><span className="font-mono text-[8px] text-slate-600">{message.time}</span></div><p className="mt-1.5 text-[10px] leading-relaxed text-slate-300">{message.detail}</p><div className="mt-2 flex items-center justify-between gap-2"><span className="font-mono text-[9px] text-ast">{message.reward}</span><span className="text-[8px] uppercase tracking-wider text-slate-600">Tap START QUIZ to begin</span></div></div></div></div>;
      }

      function ChatMessage({ message }) {
        const mine = message.kind === 'student';
        return <div className={`flex items-end gap-2.5 ${mine ? 'flex-row-reverse' : ''}`}><div className={`flex h-7 w-7 shrink-0 items-center justify-center rounded-full border text-[9px] font-semibold ${mine ? 'border-cyan/20 bg-cyan/10 text-cyan' : 'border-blue-400/20 bg-blue-400/10 text-blue-300'}`}>{mine ? 'A' : 'H'}</div><div className={`max-w-[83%] ${mine ? 'items-end' : 'items-start'} flex flex-col`}><div className={`mb-1 flex items-center gap-2 text-[8px] ${mine ? 'flex-row-reverse' : ''}`}><span className={mine ? 'text-cyan/80' : 'text-blue-300'}>{message.name}</span><span className="font-mono text-slate-600">{message.time}</span></div><div className={`rounded-2xl px-3 py-2.5 text-[10px] leading-relaxed ${mine ? 'rounded-br-sm border border-cyan/15 bg-cyan/[.08] text-slate-200' : 'rounded-bl-sm border border-slate-700/60 bg-[#1a2435] text-slate-300'}`}>{message.text}</div></div></div>;
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<AstatineAssignmentsPage />);
    </script>
  </body>
</html>
